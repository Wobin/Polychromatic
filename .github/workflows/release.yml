name: Release Polychromatic

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to upload (e.g. 1.2.0)
        required: true
      changelog:
        description: Changelog text for the mod page (dispatch runs have no release body)
        required: false
      force:
        description: Upload every zip to Nexus, even when its contents match the previous release
        type: boolean
        default: false
      only:
        description: Upload only these rows (comma-separated keys, e.g. Grenades,Polychromatic_Empty)
        required: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package and verify eight zips (no git artefacts)
        run: python3 .github/scripts/package.py --rev HEAD --repo . --out dist

      - name: Plan Nexus uploads against the previous release
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ github.event.release.tag_name || inputs.version }}
          FORCE: ${{ inputs.force }}
          ONLY: ${{ inputs.only }}
        run: |
          gh release list --limit 1000 --json tagName,isDraft,isPrerelease \
            --jq '.[] | select((.isDraft or .isPrerelease) | not) | .tagName' > "$RUNNER_TEMP/release-tags.txt"
          PREV=$(python3 .github/scripts/release_plan.py previous-tag --repo . --rev HEAD \
            --tags-file "$RUNNER_TEMP/release-tags.txt" --exclude "$CURRENT_TAG")
          PREV_MATRIX=""
          if [ -n "$PREV" ]; then
            echo "Previous release tag: $PREV"
            python3 .github/scripts/package.py --rev "refs/tags/$PREV" --repo . --out "$RUNNER_TEMP/prev" --fingerprints-only
            PREV_MATRIX="$RUNNER_TEMP/prev/matrix.json"
          else
            echo "No previous release tag: every row uploads"
          fi
          python3 .github/scripts/release_plan.py plan --current dist/matrix.json --previous "$PREV_MATRIX" \
            --previous-tag "$PREV" --force "$FORCE" --only "$ONLY" --out "$RUNNER_TEMP/plan.json" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "matrix=$(jq -c . "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
          rm dist/matrix.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Polychromatic-zips
          path: dist/*.zip

      - name: Attach zips to the GitHub release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber

  nexus:
    needs: package
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.package.outputs.matrix) }}
    steps:
      - name: Plan
        env:
          KEY: ${{ matrix.key }}
          REASON: ${{ matrix.reason }}
          UPLOAD: ${{ matrix.upload }}
          CHANGELOG: ${{ matrix.changelog }}
        run: |
          if [ "$UPLOAD" = "true" ]; then
            echo "Uploading $KEY to Nexus: $REASON (changelog: $CHANGELOG)"
          else
            echo "Skipping Nexus upload for $KEY: $REASON"
          fi

      - uses: actions/checkout@v7
        if: ${{ matrix.upload }}

      - name: Set version
        env:
          RAW_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          if [[ ! "$RAW_VERSION" =~ ^[A-Za-z0-9.-]{1,50}$ ]]; then
            echo "version \"$RAW_VERSION\" must be 1-50 characters of letters, digits, . and -" && exit 1
          fi
          echo "VERSION=$RAW_VERSION" >> "$GITHUB_ENV"

      - name: Download zips
        if: ${{ matrix.upload }}
        uses: actions/download-artifact@v7
        with:
          name: Polychromatic-zips
          path: dist

      - name: Resolve Nexus file group id
        if: ${{ matrix.upload }}
        env:
          FILE_IDS: ${{ vars.NEXUS_FILE_IDS }}
          KEY: ${{ matrix.key }}
        run: |
          if [ -z "$FILE_IDS" ]; then echo "vars.NEXUS_FILE_IDS is not set" && exit 1; fi
          FID=$(printf '%s' "$FILE_IDS" | jq -r --arg k "$KEY" '.[$k] // empty')
          if [ -z "$FID" ]; then echo "vars.NEXUS_FILE_IDS has no key \"$KEY\"" && exit 1; fi
          echo "NEXUS_FILE_ID=$FID" >> "$GITHUB_ENV"

      - name: Resolve Nexus global mod id
        if: ${{ matrix.upload && matrix.changelog }}
        env:
          NEXUSMODS_APIKEY: ${{ secrets.NEXUSMODS_APIKEY }}
          GAME_SCOPED_ID: ${{ vars.NEXUS_MOD_ID }}
        run: |
          MID=$(python3 .github/scripts/nexus.py resolve-mod --game warhammer40kdarktide --mod "$GAME_SCOPED_ID")
          echo "NEXUS_GLOBAL_MOD_ID=$MID" >> "$GITHUB_ENV"

      - name: Upload to Nexus Mods
        if: ${{ matrix.upload }}
        env:
          NEXUSMODS_APIKEY: ${{ secrets.NEXUSMODS_APIKEY }}
          ZIP: dist/${{ matrix.file }}
          CATEGORY: ${{ matrix.category }}
          DISPLAY_NAME: ${{ (matrix.key == 'Polychromatic' || matrix.key == 'Polychromatic_Empty') && matrix.key || format('Polychromatic - {0}', matrix.key) }}
          NOTES: ${{ github.event.release.body || inputs.changelog }}
          ADD_CHANGELOG: ${{ matrix.changelog }}
        run: |
          set -- --file-id "$NEXUS_FILE_ID" --zip "$ZIP" --version "$VERSION" --category "$CATEGORY" \
            --display-name "$DISPLAY_NAME $VERSION" --description="$NOTES" --update-mod-version
          if [ "$ADD_CHANGELOG" = "true" ] && [ -n "$NOTES" ]; then
            set -- "$@" --mod-id "$NEXUS_GLOBAL_MOD_ID" --changelog="$NOTES"
          fi
          python3 .github/scripts/nexus.py upload "$@"
