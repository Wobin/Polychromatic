name: Release Polychromatic

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to upload (e.g. 1.2.0)
        required: true
      changelog:
        description: Changelog text for the mod page (dispatch runs have no release body)
        required: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Package and verify eight zips (no git artefacts)
        id: build
        run: |
          python3 .github/scripts/package.py --rev HEAD --repo . --out dist
          echo "matrix=$(jq -c . dist/matrix.json)" >> "$GITHUB_OUTPUT"
          rm dist/matrix.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Polychromatic-zips
          path: dist/*.zip

      - name: Attach zips to the GitHub release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber

  nexus:
    needs: package
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.package.outputs.matrix) }}
    steps:
      - name: Set version
        run: echo "VERSION=${{ github.event.release.tag_name || inputs.version }}" >> "$GITHUB_ENV"

      - name: Download zips
        uses: actions/download-artifact@v7
        with:
          name: Polychromatic-zips
          path: dist

      - name: Resolve Nexus file group id
        env:
          FILE_IDS: ${{ vars.NEXUS_FILE_IDS }}
          KEY: ${{ matrix.key }}
        run: |
          if [ -z "$FILE_IDS" ]; then echo "vars.NEXUS_FILE_IDS is not set" && exit 1; fi
          FID=$(printf '%s' "$FILE_IDS" | jq -r --arg k "$KEY" '.[$k] // empty')
          if [ -z "$FID" ]; then echo "vars.NEXUS_FILE_IDS has no key \"$KEY\"" && exit 1; fi
          echo "NEXUS_FILE_ID=$FID" >> "$GITHUB_ENV"

      - name: Resolve Nexus global mod id (v3)
        run: |
          MID=$(curl -sS -H "apikey: ${{ secrets.NEXUSMODS_APIKEY }}" \
            "https://api.nexusmods.com/v3/games/warhammer40kdarktide/mods/${{ vars.NEXUS_MOD_ID }}" \
            | jq -r '.data.id')
          if [ -z "$MID" ] || [ "$MID" = "null" ]; then echo "no global mod id" && exit 1; fi
          echo "NEXUS_GLOBAL_MOD_ID=$MID" >> "$GITHUB_ENV"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_APIKEY }}
          file_id: ${{ env.NEXUS_FILE_ID }}
          mod_id: ${{ env.NEXUS_GLOBAL_MOD_ID }}
          filename: dist/${{ matrix.file }}
          version: ${{ env.VERSION }}
          display_name: ${{ matrix.key == 'Full' && 'Polychromatic - Full' || (matrix.key == 'Polychromatic' && 'Polychromatic' || format('Polychromatic - {0}', matrix.key)) }} ${{ env.VERSION }}
          category: ${{ matrix.category }}
          description: ${{ github.event.release.body || inputs.changelog }}
          changelog: ${{ github.event.release.body || inputs.changelog }}
          update_mod_version: true
